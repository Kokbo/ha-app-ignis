name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by the Update Ignis workflow to test a version bump before it lands on main.
  workflow_call:
    inputs:
      ref:
        description: Branch or commit to test
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  addon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: ./ignis

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: bash -n ignis/rootfs/run.sh
      - name: Version scripts handle dependency-update versions
        env:
          GITHUB_OUTPUT: ""
        run: |
          set -euo pipefail
          t="$(mktemp -d)"
          mkdir -p "$t/ignis"
          cp ignis/Dockerfile ignis/config.yaml ignis/CHANGELOG.md "$t/ignis/"
          ignis="$(sed -n 's#^ARG BUILD_FROM=nobbe/ignis:\(.*\)$#\1#p' ignis/Dockerfile)"
          # Two dependency updates: <ignis> -> <ignis>.1 -> <ignis>.2
          test "$(ROOT="$t" bash .github/scripts/bump-addon-version.sh first)" = "${ignis}.1"
          test "$(ROOT="$t" bash .github/scripts/bump-addon-version.sh second)" = "${ignis}.2"
          # A new Ignis release replaces the suffixed version.
          printf '{"results":[{"name":"99.0.0","images":[{"architecture":"amd64"},{"architecture":"arm64"}]}]}' > "$t/tags.json"
          printf 'v%s+obsidian.1.0.0\nv99.0.0+obsidian.9.9.9\n' "$ignis" > "$t/upstream-tags"
          ROOT="$t" DOCKERHUB_TAGS_JSON="$t/tags.json" UPSTREAM_TAGS="$t/upstream-tags" \
            bash .github/scripts/update-ignis.sh
          grep -qxF 'version: "99.0.0"' "$t/ignis/config.yaml"
          grep -qxF 'ARG BUILD_FROM=nobbe/ignis:99.0.0' "$t/ignis/Dockerfile"
      - name: Option parser quotes values safely
        run: |
          printf '%s' '{"vault_root":"/share/obsidian/","write_coalesce_ms":0,"ws_origins":[],"proxy_allow_private_hosts":["10.0.0.0/8"],"ignored_paths":["a'"'"'b; echo pwned"]}' > /tmp/options.json
          eval "$(node ignis/rootfs/usr/local/lib/ha-addon/options.js /tmp/options.json)"
          test "$VAULT_ROOT" = "/share/obsidian"
          test "$PROXY_ALLOW_PRIVATE_HOSTS" = "10.0.0.0/8"
          test "$IGNORED_PATHS" = "a'b; echo pwned"

  image:
    runs-on: ubuntu-latest
    needs: [addon-lint, scripts]
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build add-on image (${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ignis
          platforms: ${{ matrix.arch == 'amd64' && 'linux/amd64' || 'linux/arm64' }}
          # No BUILD_FROM: use the Dockerfile default, like the Supervisor does.
          build-args: BUILD_ARCH=${{ matrix.arch }}
          push: false
          load: true
          tags: ignis-addon:${{ matrix.arch }}
      - name: Start and wait for the web UI (${{ matrix.arch }})
        run: |
          mkdir -p /tmp/addon/data /tmp/addon/share
          echo '{"vault_root":"/share/obsidian","write_coalesce_ms":0,"ws_origins":[],"proxy_allow_private_hosts":[],"ignored_paths":[]}' > /tmp/addon/data/options.json
          docker run -d --name ignis \
            --platform ${{ matrix.arch == 'amd64' && 'linux/amd64' || 'linux/arm64' }} \
            -v /tmp/addon/data:/data -v /tmp/addon/share:/share -p 8080:8080 \
            ignis-addon:${{ matrix.arch }}
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/version; then echo; break; fi
            sleep 5
          done
          docker logs ignis
          curl -fsS http://127.0.0.1:8080/api/version
          test -f /tmp/addon/data/obsidian-app/index.html
          test -d /tmp/addon/share/obsidian
          test -d /tmp/addon/data/ignis
