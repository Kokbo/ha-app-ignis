name: Update Ignis

# Checks Docker Hub every day for a newer nobbe/ignis release. When there is one, the
# version bump is pushed to a temporary branch, tested with the full CI (build and start
# on amd64 and aarch64), and only then pushed to main, where Home Assistant picks it up.
# If CI fails, main is left alone and the update-ignis-<version> branch stays for a look.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

# No permissions by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: update-ignis
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the update-ignis-<version> branch
    outputs:
      updated: ${{ steps.push.outputs.updated }}
      latest: ${{ steps.bump.outputs.latest }}
      branch: ${{ steps.push.outputs.branch }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      # Credentials are kept on purpose: the job pushes with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: main

      - name: Look for a newer Ignis image
        id: bump
        run: bash .github/scripts/update-ignis.sh

      - name: Push the bump to a test branch
        id: push
        if: steps.bump.outputs.updated == 'true'
        env:
          LATEST: ${{ steps.bump.outputs.latest }}
        run: |
          branch="update-ignis-${LATEST}"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists: an earlier attempt for $LATEST failed CI."
            echo "Fix or delete that branch to try again."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add ignis/Dockerfile ignis/config.yaml ignis/CHANGELOG.md
          git commit -m "Update Ignis to ${LATEST}"
          git push origin "$branch"

          {
            echo "updated=true"
            echo "branch=$branch"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: bump
    if: needs.bump.outputs.updated == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  release:
    needs: [bump, test]
    if: needs.bump.outputs.updated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tested commit to main and delete the test branch
    steps:
      # Credentials are kept on purpose: the job pushes with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: main
          fetch-depth: 0

      - name: Push the tested commit to main
        env:
          SHA: ${{ needs.bump.outputs.sha }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          LATEST: ${{ needs.bump.outputs.latest }}
        run: |
          git fetch origin "$BRANCH"

          # Fast-forward only. If main moved since the check, drop the test branch so
          # tomorrow's run starts again from the new main.
          if ! git push origin "${SHA}:refs/heads/main"; then
            git push origin --delete "$BRANCH"
            echo "::warning::main changed during the update; it will be retried on the next run."
            exit 1
          fi

          git push origin --delete "$BRANCH"

          echo "Released Ignis ${LATEST} to main."
